<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT Whitepaper</title>
    <!-- GitHub Markdown CSS for perfect formatting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    <!-- Highlight.js for code snippets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        .markdown-body {
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
        }
        /* Ensure tables look perfect */
        .markdown-body table {
            display: table;
            width: 100%;
        }
        /* Center mermaid diagrams */
        .mermaid {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        
        /* Print-specific styles to ensure clean PDF breaks */
        @media print {
            body { margin: 0; padding: 20px; }
            h2 { page-break-before: always; }
            h2:first-of-type { page-break-before: avoid; }
            pre, code, table, .mermaid { page-break-inside: avoid; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div style="text-align: right; margin-bottom: 20px;" class="no-print">
        <button onclick="window.print()" style="padding: 10px 20px; background: #000; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
            Save as PDF
        </button>
    </div>

    <article class="markdown-body" id="content">
        Loading whitepaper...
    </article>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

    <script>
        // Configure Mermaid
        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        // Configure Marked to use Highlight.js and extract Mermaid
        const renderer = new marked.Renderer();
        
        renderer.code = function(code, language) {
            if (language === 'mermaid') {
                return `<div class="mermaid">${code}</div>`;
            }
            if (language && hljs.getLanguage(language)) {
                return `<pre><code class="hljs ${language}">${hljs.highlight(code, { language }).value}</code></pre>`;
            }
            return `<pre><code class="hljs">${hljs.highlightAuto(code).value}</code></pre>`;
        };

        marked.setOptions({ renderer: renderer });

        // Fetch and render the whitepaper
        fetch('../docs/orbit_whitepaper.md')
            .then(response => {
                if (!response.ok) throw new Error("Could not find orbit_whitepaper.md");
                return response.text();
            })
            .then(async text => {
                // Render markdown
                document.getElementById('content').innerHTML = marked.parse(text);
                
                // Render mermaid diagrams
                await mermaid.run({
                    nodes: document.querySelectorAll('.mermaid'),
                });

                // Auto-trigger print dialog after a brief delay for rendering
                setTimeout(() => {
                    window.print();
                }, 1000);
            })
            .catch(error => {
                document.getElementById('content').innerHTML = 
                    `<div style="color: red; padding: 20px; border: 1px solid red; border-radius: 5px;">
                        Error: ${error.message}.<br><br>
                        Make sure you are opening this via a local server (e.g. using VS Code Live Server or 'npx serve') 
                        because browsers block fetching local files directly from file:// paths.
                    </div>`;
            });
    </script>
</body>
</html>
